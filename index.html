<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NutriDeck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='8' fill='%237c5cff'/%3E%3Crect x='20' y='12' width='24' height='26' rx='5' fill='%23fff'/%3E%3Ccircle cx='32' cy='48' r='5' fill='%2322d3a0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <a class="logo" href="#table" aria-label="NutriDeck">
      <span class="logo-mark"><i></i><i></i><i></i></span>
      <span class="logo-text">Nutri<b>Deck</b></span>
    </a>
    <div class="top-tools">
      <button class="icon-btn" id="btn-guide" aria-label="Comprendre les scores" title="Comprendre Nutri-Score, NOVA, Eco-Score"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 16.8h.01"/></svg></button>
      <button class="icon-btn" id="btn-mode" aria-label="Jour / nuit" title="Jour / nuit"></button>
      <button class="icon-btn" id="btn-density" aria-label="Taille des cartes" title="Taille des cartes"></button>
    </div>
  </header>

  <main>
    <!-- DÉCOUVRIR -->
    <section id="view-discover" class="view" hidden>
      <div class="searchbar">
        <form id="search-form" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Produit, marque ou code-barres" aria-label="Rechercher">
          <button type="button" class="scan-btn" id="btn-scan" aria-label="Scanner un code-barres" hidden>
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
          </button>
        </form>
        <div class="chips" id="chips" role="list"></div>
        <div class="filters">
          <label class="switch"><input type="checkbox" id="only-scored" checked><span></span> Avec Nutri-Score</label>
          <button class="ghost-btn" id="btn-random">🎲 Surprends-moi</button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="grid" id="results"></div>
      <div class="more"><button class="primary-btn" id="btn-more" hidden>Charger plus</button></div>
    </section>

    <!-- TABLE -->
    <section id="view-table" class="view" hidden>
      <div id="zones" data-board="table"></div>
      <button class="add-zone" id="btn-add-zone"><span>＋</span> Nouvelle zone</button>
      <p class="foot">Glisse une carte sur une autre pour les empiler · appui long sur mobile pour attraper une carte</p>
    </section>

    <!-- JEUX -->
    <section id="view-games" class="view" hidden>
      <div class="games-hero">
        <h1>Jeux</h1>
        <p>Quatre modes solo avec les mêmes cartes que ta table. Le multijoueur arrive ensuite.</p>
      </div>
      <div class="game-list" id="game-list"></div>
    </section>

    <!-- ATELIER -->
    <section id="view-lab" class="view" hidden></section>
  </main>

  <div class="trash" id="trash" aria-hidden="true"><span>🗑️</span> Lâche ici pour retirer</div>

  <nav class="tabs" aria-label="Navigation">
    <a href="#discover" data-tab="discover"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Découvrir</span></a>
    <a href="#table" data-tab="table"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="11" height="15" rx="2.5"/><path d="M17.5 7.5 20.5 8.8 17 19.5"/></svg><span>Table</span><em id="count-badge" hidden>0</em></a>
    <a href="#games" data-tab="games"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 11v4M6 13h4M15.5 12.2h.01M17.5 14h.01"/></svg><span>Jeux</span></a>
    <a href="#lab" data-tab="lab"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg><span>Atelier</span></a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="games.js"></script>
  <script src="online.js"></script>
  <script src="main.js"></script>
</body>
</html>
